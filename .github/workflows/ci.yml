name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: shellcheck install.sh
        if: runner.os == 'Linux'
        run: shellcheck install.sh
      - run: go vet ./...
      - name: test
        run: go test ./...
      - name: test (race detector)
        if: runner.os == 'Linux'
        run: go test -race ./...
